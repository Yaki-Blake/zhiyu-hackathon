# nginx alternative to Caddy. Certificates are managed separately (certbot).
# Install: cp deploy/nginx.conf /etc/nginx/sites-available/zhiyu
#          ln -s /etc/nginx/sites-available/zhiyu /etc/nginx/sites-enabled/zhiyu
#          certbot --nginx -d zhiyu.example.com
#          nginx -t && systemctl reload nginx

server {
    listen 80;
    server_name zhiyu.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name zhiyu.example.com;

    ssl_certificate     /etc/letsencrypt/live/zhiyu.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zhiyu.example.com/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location / {
        proxy_pass http://127.0.0.1:4173;
        proxy_set_header Host $host;
        # $proxy_add_x_forwarded_for appends $remote_addr to whatever the client
        # sent, so a forged X-Forwarded-For becomes the first (trusted) element and
        # defeats per-IP rate limiting. Overwrite it with the real peer address.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
